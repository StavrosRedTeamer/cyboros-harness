<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stavros Redteamer · Command Center</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo" data-glyph="◈" tabindex="0" aria-label="Stavros Redteamer">◈</span>
    <div class="brand-text">
      <h1><span class="brand-name" data-text="STAVROS REDTEAMER">STAVROS REDTEAMER</span><span class="brand-tag">COMMAND CENTER</span></h1>
      <div class="sub" id="server-sub">loading…</div>
    </div>
  </div>
  <div class="badges">
    <button id="btn-cmdk" class="btn btn-ghost" title="Command palette (Ctrl/⌘-K)" aria-haspopup="dialog"><kbd>⌘K</kbd> commands</button>
    <button id="btn-refresh" class="btn" title="refresh all">⟳ refresh</button>
  </div>
</header>

<nav id="tabs" role="tablist" aria-label="Sezioni">
  <span class="navgroup" aria-hidden="true">Engagement</span>
  <button class="tab active" data-tab="overview" role="tab" id="tabbtn-overview" aria-controls="tab-overview" aria-selected="true" tabindex="0">Overview</button>
  <button class="tab" data-tab="campaign" role="tab" id="tabbtn-campaign" aria-controls="tab-campaign" aria-selected="false" tabindex="-1">Campaign</button>
  <button class="tab" data-tab="mission" role="tab" id="tabbtn-mission" aria-controls="tab-mission" aria-selected="false" tabindex="-1">Mission</button>
  <button class="tab" data-tab="approvals" role="tab" id="tabbtn-approvals" aria-controls="tab-approvals" aria-selected="false" tabindex="-1">Approvals</button>
  <button class="tab" data-tab="ledger" role="tab" id="tabbtn-ledger" aria-controls="tab-ledger" aria-selected="false" tabindex="-1">Ledger</button>
  <span class="navgroup" aria-hidden="true">Attack</span>
  <button class="tab" data-tab="findings" role="tab" id="tabbtn-findings" aria-controls="tab-findings" aria-selected="false" tabindex="-1">Findings</button>
  <button class="tab" data-tab="pipeline" role="tab" id="tabbtn-pipeline" aria-controls="tab-pipeline" aria-selected="false" tabindex="-1">Pipeline</button>
  <button class="tab" data-tab="sessions" role="tab" id="tabbtn-sessions" aria-controls="tab-sessions" aria-selected="false" tabindex="-1">Sessions</button>
  <button class="tab" data-tab="graph" role="tab" id="tabbtn-graph" aria-controls="tab-graph" aria-selected="false" tabindex="-1">Graph</button>
  <button class="tab" data-tab="coverage" role="tab" id="tabbtn-coverage" aria-controls="tab-coverage" aria-selected="false" tabindex="-1">Coverage</button>
  <span class="navgroup" aria-hidden="true">Control</span>
  <button class="tab" data-tab="scope" role="tab" id="tabbtn-scope" aria-controls="tab-scope" aria-selected="false" tabindex="-1">Scope</button>
  <button class="tab" data-tab="control" role="tab" id="tabbtn-control" aria-controls="tab-control" aria-selected="false" tabindex="-1">Control</button>
  <span class="navgroup" aria-hidden="true">Console</span>
  <button class="tab" data-tab="reports" role="tab" id="tabbtn-reports" aria-controls="tab-reports" aria-selected="false" tabindex="-1">Reports</button>
  <button class="tab" data-tab="freebuff" role="tab" id="tabbtn-freebuff" aria-controls="tab-freebuff" aria-selected="false" tabindex="-1">Freebuff</button>
</nav>

<div id="status-rail" role="status" aria-live="polite" aria-label="Engagement status"></div>

<main id="view">
  <section id="tab-overview" class="tabpane active" role="tabpanel" aria-labelledby="tabbtn-overview"></section>
  <section id="tab-campaign" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-campaign"></section>
  <section id="tab-mission" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-mission"></section>
  <section id="tab-approvals" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-approvals"></section>
  <section id="tab-ledger" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-ledger"></section>
  <section id="tab-findings" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-findings"></section>
  <section id="tab-pipeline" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-pipeline"></section>
  <section id="tab-sessions" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-sessions"></section>
  <section id="tab-graph" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-graph"></section>
  <section id="tab-coverage" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-coverage"></section>
  <section id="tab-scope" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-scope"></section>
  <section id="tab-control" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-control"></section>
  <section id="tab-reports" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-reports"></section>
  <section id="tab-freebuff" class="tabpane" role="tabpanel" aria-labelledby="tabbtn-freebuff"></section>
</main>

<div id="toast-wrap" role="status" aria-live="polite" aria-atomic="false"></div>

<div id="cmdk" class="hidden" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmdk-box">
    <input type="text" id="cmdk-input" placeholder="Jump to a tab or run an action…" aria-label="Command palette search" spellcheck="false" autocomplete="off">
    <ul class="cmdk-list" id="cmdk-list" role="listbox" aria-label="Commands"></ul>
    <div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>

<div id="job-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="job-modal-title">Job</strong>
      <span id="job-modal-state" class="chip">running</span>
      <button class="btn btn-sm" data-action="job-close">✕</button>
    </div>
    <div id="job-modal-body">
      <pre id="job-log"></pre>
      <div id="job-modal-done"></div>
    </div>
  </div>
</div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="views-engagement.js"></script>
<script src="views-control.js"></script>
<script src="app.js"></script>
</body>
</html>
