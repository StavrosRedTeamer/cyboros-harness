<script>
'use strict';
/* Grafo del progetto StavrosRedTeamer — self-contained, zero dipendenze.
   Quattro viste: Componenti · Fasi engagement · Prova & stato · Lab & runner.
   I contenuti sono ricavati dai file reali del repo (ARCHITECTURE.md, gate.js,
   evo-x2-lab/README.md, local/README-local.md); le parti "pianificato" vengono
   dalla discussione sul deployment self-hosted e non sono ancora nel repo. */

const NS = 'http://www.w3.org/2000/svg';
const C = {
  ink: '#eae7f7', muted: '#9b90b8', faint: '#665b84', line: '#261a3d',
  cyan: '#24e3ff', mag: '#ff2d95', purple: '#b98cff', orange: '#ff8324',
  green: '#24e38b', yellow: '#ffd60a', red: '#ff2b5e', low: '#2ad4ff', blue: '#7d8cff',
};

// ── helpers ────────────────────────────────────────────────────────────────
function N(id, x, y, w, h, title, sub, accent, detail, files, opts) {
  return Object.assign({ id, x, y, w, h, title, sub, accent, detail, files: files || [] }, opts || {});
}
function E(a, b, kind) { return { a, b, kind: kind || 'flow' }; }
function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function wrap(text, max) {
  // divide anche le parole lunghe sui trattini (es. effective-findings)
  const words = [];
  for (const w of String(text).split(/\s+/).filter(Boolean)) {
    if (w.length > max && w.includes('-')) {
      const segs = w.split('-').map((s, i, arr) => (i < arr.length - 1 ? s + '-' : s));
      words.push(...segs);
    } else words.push(w);
  }
  const lines = []; let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines;
}
function center(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }
function borderPoint(n, tx, ty) {
  const c = center(n);
  const dx = tx - c.x, dy = ty - c.y;
  if (!dx && !dy) return c;
  const sx = dx ? (n.w / 2) / Math.abs(dx) : Infinity;
  const sy = dy ? (n.h / 2) / Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return { x: c.x + dx * s, y: c.y + dy * s };
}
function edgePath(a, b, bow) {
  const ac = center(a), bc = center(b);
  if (bow === 'bottom' || bow === 'bottom2') {
    // arco sotto la riga: dagli spigoli inferiori, con un salto sotto entrambi i nodi
    const p1 = { x: ac.x, y: a.y + a.h };
    const p2 = { x: bc.x, y: b.y + b.h };
    const dip = Math.max(p1.y, p2.y) + (bow === 'bottom2' ? 58 : 30);
    return `M ${p1.x} ${p1.y} C ${p1.x} ${dip}, ${p2.x} ${dip}, ${p2.x} ${p2.y}`;
  }
  const p1 = borderPoint(a, bc.x, bc.y);
  const p2 = borderPoint(b, ac.x, ac.y);
  const vertical = Math.abs(bc.x - ac.x) < Math.abs(bc.y - ac.y);
  if (vertical) {
    const my = (p1.y + p2.y) / 2;
    return `M ${p1.x} ${p1.y} C ${p1.x} ${my}, ${p2.x} ${my}, ${p2.x} ${p2.y}`;
  }
  const mx = (p1.x + p2.x) / 2;
  return `M ${p1.x} ${p1.y} C ${mx} ${p1.y}, ${mx} ${p2.y}, ${p2.x} ${p2.y}`;
}

// ── renderer ───────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const aside = document.getElementById('details');
let activeTab = null;
const tabsNav = document.getElementById('tabs');

function buildSvg(spec) {
  const svg = svgEl('svg', { viewBox: `0 0 ${spec.w} ${spec.h}`, width: spec.w, height: spec.h, xmlns: NS });
  const defs = svgEl('defs', {});
  const marker = svgEl('marker', { id: 'arr', viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '6.5', markerHeight: '6.5', orient: 'auto-start-reverse' });
  marker.appendChild(svgEl('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#665b84' }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  const byId = new Map();
  for (const n of spec.nodes) byId.set(n.id, n);

  // titoli di gruppo
  for (const t of spec.titles || []) {
    const tx = svgEl('text', { x: t.x, y: t.y, fill: t.color || C.muted, 'font-size': t.size || 15, 'font-family': 'var(--mono)', 'font-weight': t.weight || 600 });
    tx.textContent = t.text;
    svg.appendChild(tx);
  }

  // edge sotto i nodi
  const edgeEls = [];
  const perNode = new Map();
  for (const e of spec.edges || []) {
    const a = byId.get(e.a), b = byId.get(e.b);
    if (!a || !b) { console.warn('edge con nodo mancante', e); continue; }
    const g = svgEl('g', { class: 'edge ' + e.kind });
    const p = svgEl('path', {
      d: edgePath(a, b, e.bow), fill: 'none',
      stroke: e.kind === 'faint' ? '#3d2c61' : '#4a3868',
      'stroke-width': e.kind === 'faint' ? 1.1 : 1.4,
      'stroke-dasharray': e.kind === 'faint' ? '4 5' : 'none',
      'marker-end': 'url(#arr)',
    });
    g.appendChild(p);
    svg.appendChild(g);
    edgeEls.push({ a: e.a, b: e.b, p });
    for (const id of [e.a, e.b]) {
      if (!perNode.has(id)) perNode.set(id, []);
      perNode.get(id).push(p);
    }
  }

  // nodi
  for (const n of spec.nodes) {
    if (n.invisible) continue;
    const g = svgEl('g', { class: 'node', 'data-id': n.id, transform: `translate(${n.x},${n.y})`, tabindex: '0' });
    g.style.color = n.accent;
    const rect = svgEl('rect', {
      x: 0, y: 0, width: n.w, height: n.h, rx: 8,
      fill: n.fill || '#120c1e', stroke: n.accent, 'stroke-width': 1.2,
      'stroke-opacity': n.opacity !== undefined ? n.opacity : 0.72,
      'stroke-dasharray': n.dashed ? '5 4' : 'none',
    });
    g.appendChild(rect);

    const maxTitle = Math.max(10, Math.floor((n.w - 28) / 7.3));
    const maxSub = Math.max(10, Math.floor((n.w - 28) / 6.4));
    const titleLines = wrap(n.title, maxTitle);
    const subLines = n.sub ? wrap(n.sub, maxSub) : [];
    const total = titleLines.length * 16 + (subLines.length ? 6 + subLines.length * 13 : 0);
    let y = n.h / 2 - total / 2 + 12;

    for (const line of titleLines) {
      const t = svgEl('text', { x: 14, y, fill: C.ink, 'font-size': 13, 'font-family': 'var(--mono)', 'font-weight': 700 });
      t.textContent = line;
      g.appendChild(t); y += 16;
    }
    if (subLines.length) {
      y += 3;
      for (const line of subLines) {
        const t = svgEl('text', { x: 14, y, fill: C.muted, 'font-size': 11, 'font-family': 'var(--mono)' });
        t.textContent = line;
        g.appendChild(t); y += 13;
      }
    }
    g.addEventListener('mouseenter', () => highlight(n.id, true));
    g.addEventListener('mouseleave', () => highlight(n.id, false));
    g.addEventListener('click', () => select(n.id, spec));
    g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id, spec); } });
    svg.appendChild(g);
  }

  // note / box
  for (const nt of spec.notes || []) {
    const g = svgEl('g', { class: 'note' });
    if (nt.box !== false) {
      g.appendChild(svgEl('rect', {
        x: nt.x, y: nt.y - 4, width: nt.w, height: nt.h || (nt.lines.length * 14 + 26), rx: 6,
        fill: nt.bg || '#0d0917', stroke: nt.color || '#2a1f45', 'stroke-width': 1,
      }));
    }
    let y = nt.y + 14;
    if (nt.heading) {
      const h = svgEl('text', { x: nt.x + 12, y, fill: nt.color || C.muted, 'font-size': 11.5, 'font-family': 'var(--mono)', 'font-weight': 700 });
      h.textContent = nt.heading;
      g.appendChild(h); y += 18;
    }
    const max = Math.max(20, Math.floor(((nt.w || 400) - 24) / 7.0));
    for (const line of nt.lines) {
      for (const l of wrap(line, max)) {
        const t = svgEl('text', { x: nt.x + 12, y, fill: nt.fill || C.muted, 'font-size': 11.5, 'font-family': 'var(--mono)' });
        if (nt.bullets) t.textContent = '· ' + l; else t.textContent = l;
        g.appendChild(t); y += 14;
      }
    }
    svg.appendChild(g);
  }

  function highlight(id, on) {
    const node = svg.querySelector(`.node[data-id="${id}"]`);
    if (node) node.classList.toggle('hot', on);
    for (const p of perNode.get(id) || []) p.classList.toggle('hot', on);
    svg.classList.toggle('focused', !!on);
  }

  function select(id, s) {
    const n = byId.get(id);
    if (!n) return;
    for (const el of svg.querySelectorAll('.node.sel')) el.classList.remove('sel');
    const node = svg.querySelector(`.node[data-id="${id}"]`);
    if (node) node.classList.add('sel');
    const files = (n.files || []).map((f) => `<code>${f}</code>`).join('<br>');
    aside.innerHTML =
      `<h2>${n.title}</h2>` +
      (n.sub ? `<p class="asub">${n.sub}</p>` : '') +
      `<div class="detail">${n.detail || ''}</div>` +
      (files ? `<div class="files"><strong>Fonti</strong><br>${files}</div>` : '');
  }

  return svg;
}

function render(key) {
  activeTab = key;
  for (const b of tabsNav.querySelectorAll('button')) b.classList.toggle('on', b.dataset.key === key);
  const tab = TABS.find((t) => t.id === key) || TABS[0];
  const spec = tab.build();
  stage.replaceChildren(buildSvg(spec));
  aside.innerHTML = '<p class="hint">Clicca un nodo del grafo per leggere descrizione e fonti. Passa il mouse per evidenziare le connessioni.</p>';
  history.replaceState(null, '', '#' + key);
}

// ── tab 1 · componenti ─────────────────────────────────────────────────────
function buildComponents() {
  const nodes = [], edges = [], titles = [], notes = [];

  titles.push({ x: 40, y: 66, text: 'Deployment self-hosted — pianificato (non ancora nel repo)', color: C.cyan, size: 14 });
  titles.push({ x: 1080, y: 238, text: 'Superfici operative', color: C.cyan, size: 15 });
  titles.push({ x: 44, y: 242, text: 'L4 · Agent fleet — advisory', color: C.mag, size: 12, weight: 700 });
  titles.push({ x: 44, y: 358, text: 'L3 · Conoscenza — recuperata, mai enforcement', color: C.purple, size: 12, weight: 700 });
  titles.push({ x: 44, y: 460, text: 'L2 · Guard layer — fail-closed, fuori dalla portata del modello', color: C.orange, size: 12, weight: 700 });
  titles.push({ x: 44, y: 562, text: 'L1 · Proof layer — cosa un finding può affermare', color: C.green, size: 12, weight: 700 });
  titles.push({ x: 44, y: 664, text: 'L0 · Stato — output deterministico', color: C.yellow, size: 12, weight: 700 });

  // deployment
  nodes.push(N('d-router', 40, 90, 250, 96, 'Router privacy', 'OPNsense + AdGuard Home · blocklist DNS · policy per VLAN', C.cyan,
    'Pianificato. Il router fa compartimentazione e tunnel, non anonimato: DNS filtering con blocklist, resolver locale forzato (redirect porta 53, blocco DoT/DoH se i client provano a scavalcare), WireGuard, IPv6 gestito, policy per VLAN (HOME / LAB / EXEC / ANON / MGMT). Il fingerprint browser non si cambia dal router: è lato client.',
    ['docs/egress-opsec.md', 'docs/THREAT-MODEL.md'], { dashed: true }));
  nodes.push(N('d-switch', 325, 90, 250, 96, 'Switch managed 2.5GbE', 'VLAN deny-by-default tra zone', C.cyan,

    ['evo-x2-lab/docs/setup-evo-x2.md'], { dashed: true }));
  nodes.push(N('d-m5a', 610, 90, 250, 96, 'Bosgame M5 #1 — Brain', 'Qwen3.8-Flash-Next-Heretic (~85 GB)', C.cyan,
    'Pianificato: nodo «brain» del lab — llama.cpp/llama-server, ruoli PLANNER · JUDGE · ARBITRO · AUTO-PROMPTER. Delta M5: una sola porta 2.5GbE, BIOS UMA/GTT da verificare (report di unità limitate a 64 GB usabili), checklist di accettazione prima della seconda unità.',
    ['evo-x2-lab/deploy/models.yaml', 'evo-x2-lab/docs/setup-evo-x2.md'], { dashed: true }));
  nodes.push(N('d-m5b', 895, 90, 250, 96, 'Bosgame M5 #2 — Worker pool', 'coder · toolcaller · parser · cyber · RAG', C.cyan,
    'Pianificato: worker pool con modelli specializzati (coder, tool caller, parser, critico cyber, triage, RAG BGE-M3 + reranker). Modelli separati per nodo e routing a livello API: nessuno split di tensori cross-nodo.',
    ['evo-x2-lab/deploy/models.yaml', 'evo-x2-lab/README.md'], { dashed: true }));
  nodes.push(N('d-pc', 1180, 90, 250, 96, 'PC di casa — solo progetto', 'workstation · gateway · audit · zona EXEC', C.cyan,
    'Pianificato: dedicato solo al progetto — workstation operatore, gateway (nginx njs :8080 spostato fuori dal brain), audit sink e zona EXEC isolata (Docker + tool) con egress forzato via egress-proxy.js e kill-switch.',
    ['docs/egress-opsec.md', 'docs/THREAT-MODEL.md'], { dashed: true }));

  // harness layers
  nodes.push(N('h-l4', 40, 250, 980, 84, 'Agent fleet — 28 agenti', 'orchestrator + specialisti · local/fleet/ · .agents/', C.mag,
    '28 definizioni agente (orchestrator + specialisti). Propongono tecniche e scrivono finding: livello advisory — non decidono autorizzazioni e non decidono la severità.',
    ['local/README-local.md']));
  nodes.push(N('band-l3', 40, 372, 980, 64, '', '', C.purple, '', [], { invisible: true }));
  nodes.push(N('band-l2', 40, 474, 980, 64, '', '', C.orange, '', [], { invisible: true }));
  nodes.push(N('band-l1', 40, 576, 980, 64, '', '', C.green, '', [], { invisible: true }));
  nodes.push(N('band-l0', 40, 678, 980, 64, '', '', C.yellow, '', [], { invisible: true }));

  nodes.push(N('h-k', 40, 372, 230, 64, 'knowledge.md', 'il contratto: ROE 1–5 · verification levels', C.purple,
    'Il contratto dell\'engagement: regole ROE 1–5, verification levels, toolbox compatto. Letto all\'avvio degli agenti; mai punto di enforcement.', ['knowledge.md']));
  nodes.push(N('h-ops', 290, 372, 230, 64, 'ops/harness.md + docs/', 'regole condivise · metodologia per classe', C.purple,

// ── tab registry + init ────────────────────────────────────────────────────
const TABS = [
  { id: 'componenti', label: 'Componenti', build: buildComponents },
  { id: 'fasi', label: 'Fasi engagement', build: buildPhases },
  { id: 'prova', label: 'Prova & stato', build: buildProof },
  { id: 'lab', label: 'Lab & runner', build: buildLab },
];

const LEGEND = [
  ['pianificato', C.cyan], ['fleet', C.mag], ['conoscenza', C.purple], ['guardie', C.orange],
  ['prova', C.green], ['stato', C.yellow], ['lab', C.blue],
];
const legendEl = document.getElementById('legend');
for (const [label, color] of LEGEND) {
  const s = document.createElement('span');
  s.innerHTML = `<i style="background:${color}"></i>${label}`;
  legendEl.appendChild(s);
}

for (const t of TABS) {
  const b = document.createElement('button');
  b.textContent = t.label;
  b.dataset.key = t.id;
  b.addEventListener('click', () => render(t.id));
  tabsNav.appendChild(b);
}

const initial = (location.hash || '').replace('#', '');
render(TABS.some((t) => t.id === initial) ? initial : TABS[0].id);

let nativeScale = false;
const fitBtn = document.getElementById('fit');
fitBtn.addEventListener('click', () => {
  nativeScale = !nativeScale;
  stage.classList.toggle('native', nativeScale);
  fitBtn.textContent = nativeScale ? 'adatta' : '1:1';
});

document.getElementById('dl').addEventListener('click', () => {
  const svg = stage.querySelector('svg');
  if (!svg) return;
  const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `project-graph-${activeTab}.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
