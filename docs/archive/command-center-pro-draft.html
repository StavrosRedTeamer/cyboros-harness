<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stavros Command Center — Design Draft</title>
<!--
  DESIGN DRAFT (bozza) — not wired to the backend.
  A calmer, enterprise-grade visual language for the Stavros Command Center,
  inspired by tools professionals actually run: Linear, Sentry, Datadog,
  Vanta/Drata, DefectDojo, Snyk, Jira. Zero dependencies, offline, no external
  assets (matches the project guardrails).
-->
<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --bg:#0a0c11; --bg-2:#0e1117; --panel:#12151d; --panel-2:#161a24; --panel-3:#1b2030;
  --line:#222838; --line-2:#2b3346; --line-3:#39425a;
  --ink:#e7eaf1; --muted:#98a1b4; --faint:#666f83;
  --accent:#5b8def; --accent-2:#8ab0ff; --accent-dim:rgba(91,141,239,.14);
  --ok:#37b877; --warn:#dfa63b; --crit:#e5555d; --high:#e08a4e; --med:#d6bb45; --low:#5a9fd4; --info:#7d879a;
  --crit-dim:rgba(229,85,93,.13); --high-dim:rgba(224,138,78,.13); --med-dim:rgba(214,187,69,.13);
  --low-dim:rgba(90,159,212,.13); --ok-dim:rgba(55,184,119,.13); --warn-dim:rgba(223,166,59,.13);
  --r:8px; --r-sm:6px; --r-lg:12px;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.28);
  --sidebar-w:250px; --topbar-h:56px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ── app shell ──────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--bg-2);border-right:1px solid var(--line);overflow:hidden}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}

/* brand */
.side-head{display:flex;align-items:center;gap:11px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#2a3a63,#16203a);border:1px solid #33456f;color:var(--accent-2);font-weight:800;font-size:15px;flex:0 0 auto}
.side-head .t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.side-head .t b{font-size:13.5px;letter-spacing:.2px}
.side-head .t span{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.14em;font-family:var(--mono)}
.draft-badge{margin-left:auto;font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn-dim);background:var(--warn-dim);border-radius:999px;padding:3px 7px}

/* campaign switcher */
.campaign{margin:12px 14px 6px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel)}
.campaign .k{font:600 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--faint)}
.campaign .v{margin-top:6px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;min-width:0}
.campaign .v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.campaign .sub{margin-top:3px;font-size:11px;color:var(--muted)}
.pip{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
.pip.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-dim)} .pip.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-dim)} .pip.crit{background:var(--crit);box-shadow:0 0 0 3px var(--crit-dim)} .pip.live{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}

/* nav */
.nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
.nav-group{margin:14px 8px 6px;font:600 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.15em;color:var(--faint)}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:13px;text-align:left}
.nav-item .icon{color:var(--faint)}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item:hover .icon{color:var(--muted)}
.nav-item.active{background:var(--accent-dim);color:#dbe6ff}
.nav-item.active .icon{color:var(--accent-2)}
.nav-item .count{margin-left:auto;font:600 10.5px/1 var(--mono);color:var(--faint);background:var(--panel-3);border-radius:999px;padding:3px 7px}
.nav-item .count.hot{color:var(--crit);background:var(--crit-dim)}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted)}
.side-foot .avatar{width:26px;height:26px;border-radius:50%;background:var(--panel-3);border:1px solid var(--line-2);display:grid;place-items:center;font:700 11px var(--mono);color:var(--ink)}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(10,12,17,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint)}
.crumbs b{color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:9px;min-width:260px;padding:7px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);color:var(--faint);font-size:12.5px}
.search:hover{border-color:var(--line-3);color:var(--muted)}
.search kbd{margin-left:auto}
kbd{font:600 10.5px var(--mono);color:var(--muted);background:var(--panel-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.env{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--mono);padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel);white-space:nowrap}
.env.ok{color:var(--ok);border-color:var(--ok-dim);background:var(--ok-dim)}
.env.ro{color:var(--warn);border-color:var(--warn-dim);background:var(--warn-dim)}
.clock{font:12px var(--mono);color:var(--muted);white-space:nowrap}

/* ── content ────────────────────────────────────────────── */
.content{flex:1;padding:24px 26px 48px;max-width:1680px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.2px}
.page-head .sub{margin-top:5px;color:var(--muted);font-size:13px;max-width:70ch}
.page-actions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-size:12.5px;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--line-3);background:var(--panel-3)}
.btn .icon{width:15px;height:15px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#08101f}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 9px;font-size:11.5px}
.btn-ok{color:var(--ok);border-color:var(--ok-dim);background:var(--ok-dim)}
.btn-danger{color:var(--crit);border-color:var(--crit-dim);background:var(--crit-dim)}

/* ── kpi cards ──────────────────────────────────────────── */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:18px}
.kpi{padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);position:relative;text-align:left}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--line-3)}
.kpi .k{font:600 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}
.kpi .v{margin-top:9px;font:650 27px/1 var(--sans);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:7px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .d .up{color:var(--crit)} .kpi .d .down{color:var(--ok)}
.kpi.tone-crit .v{color:var(--crit)} .kpi.tone-high .v{color:var(--high)} .kpi.tone-med .v{color:var(--med)}
.kpi.tone-ok .v{color:var(--ok)} .kpi.tone-accent .v{color:var(--accent-2)}
.kpi .spark{position:absolute;right:14px;top:14px;opacity:.85}

/* ── grid + panels ──────────────────────────────────────── */
.grid{display:grid;gap:16px;align-items:start}
.grid.c2{grid-template-columns:1.55fr 1fr}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.1px}
.panel-head .hint{font-size:11.5px;color:var(--faint);font-weight:400}
.panel-head .ways{margin-left:auto;display:flex;gap:7px;align-items:center}
.panel-body{padding:16px}
.panel-body.tight{padding:6px 0}
.empty{padding:22px;color:var(--faint);font-size:12.5px;text-align:center}

/* ── severity bars ──────────────────────────────────────── */
.sev-list{display:flex;flex-direction:column;gap:11px}
.sev-row{display:grid;grid-template-columns:96px 1fr 42px;align-items:center;gap:12px}
.sev-name{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sev-dot{display:inline-block;vertical-align:middle;width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.sev-track{height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.sev-fill{height:100%;border-radius:4px}
.sev-count{text-align:right;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.s-crit{background:var(--crit);color:var(--crit)} .s-high{background:var(--high);color:var(--high)}
.s-med{background:var(--med);color:var(--med)} .s-low{background:var(--low);color:var(--low)} .s-info{background:var(--info);color:var(--info)}

/* ── pills ──────────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1.3 var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.nodot::before{display:none}
.pill.crit{color:var(--crit);border-color:var(--crit-dim);background:var(--crit-dim)}
.pill.high{color:var(--high);border-color:var(--high-dim);background:var(--high-dim)}
.pill.med{color:var(--med);border-color:var(--med-dim);background:var(--med-dim)}
.pill.low{color:var(--low);border-color:var(--low-dim);background:var(--low-dim)}
.pill.info{color:var(--info)}
.pill.ok{color:var(--ok);border-color:var(--ok-dim);background:var(--ok-dim)}
.pill.warn{color:var(--warn);border-color:var(--warn-dim);background:var(--warn-dim)}
.pill.accent{color:var(--accent-2);border-color:var(--accent-dim);background:var(--accent-dim)}

/* ── tables ─────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{position:sticky;top:0;background:var(--panel-2);color:var(--faint);font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.11em;z-index:1}
tbody tr:hover td{background:var(--panel-2)}
tbody tr{cursor:pointer}
tbody tr:last-child td{border-bottom:0}
td.c{text-align:center}
td.r{text-align:right}
.host{font:12px var(--mono);color:var(--muted)}
.sev-cell{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}

/* ── activity feed ──────────────────────────────────────── */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto;background:var(--panel-3);color:var(--muted)}
.feed-ico.crit{background:var(--crit-dim);color:var(--crit)} .feed-ico.ok{background:var(--ok-dim);color:var(--ok)}
.feed-ico.accent{background:var(--accent-dim);color:var(--accent-2)} .feed-ico.warn{background:var(--warn-dim);color:var(--warn)}
.feed-body{min-width:0;flex:1}
.feed-body .t{font-size:12.5px;line-height:1.45}
.feed-body .t b{font-weight:600}
.feed-time{margin-left:auto;font:11px var(--mono);color:var(--faint);white-space:nowrap}

/* ── mission action cards ───────────────────────────────── */
.actions{display:flex;flex-direction:column;gap:11px;padding:16px}
.action{border:1px solid var(--line-2);border-left:3px solid var(--line-3);border-radius:var(--r-sm);background:var(--panel-2);padding:13px 14px}
.action.a-auto{border-left-color:var(--accent)} .action.a-confirm{border-left-color:var(--warn)} .action.a-blocked{border-left-color:var(--crit);opacity:.9}
.action .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.action .top b{font-size:13.5px;font-weight:600}
.action .why{margin-top:7px;color:var(--muted);font-size:12.5px;line-height:1.5;max-width:78ch}
.action .cmd{margin-top:9px;font:11.5px var(--mono);color:var(--muted);background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;overflow-x:auto;white-space:nowrap}
.action .foot{margin-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.action .foot .meta{font-size:11.5px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.action .spacer{flex:1}

/* ── approvals ──────────────────────────────────────────── */
.appr{border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel-2);padding:13px 14px;display:flex;gap:13px;flex-wrap:wrap;align-items:flex-start}
.appr .body{min-width:0;flex:1}
.appr .body b{font-size:13px}
.appr .body .meta{margin-top:5px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.appr .acts{display:flex;gap:8px;align-items:center}

/* ── small stat strip ───────────────────────────────────── */
.statline{display:flex;flex-wrap:wrap;gap:26px;padding:4px 0}
.statline .s{display:flex;flex-direction:column;gap:3px}
.statline .s .k{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}
.statline .s .v{font:600 17px var(--sans);font-variant-numeric:tabular-nums}

/* ── lists, meters, key-value, toggles ──────────────────── */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--panel-2)}
.lrow .grow{min-width:0;flex:1}
.lrow .t{font-size:12.8px;line-height:1.45}
.lrow .s{margin-top:3px;font-size:11.5px;color:var(--muted)}
.lrow .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.meter{display:block;height:6px;border-radius:3px;background:var(--panel-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px 24px}
.kv .k{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}
.kv .v{margin-top:4px;font-size:13px;line-height:1.5}
.sw{width:36px;height:20px;border-radius:999px;background:var(--panel-3);border:1px solid var(--line-2);position:relative;flex:0 0 auto;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease}
.sw.on{background:var(--accent-dim);border-color:var(--accent)}
.sw.on::after{left:18px;background:var(--accent-2)}

/* ── coverage matrix + tool cards ───────────────────────── */
.matrix{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.cell{border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel-2);padding:11px 12px}
.cell .c-k{font:600 11.5px var(--mono);color:var(--muted)}
.cell .c-v{margin-top:6px;font-size:11.5px;color:var(--faint)}
.cell.done{border-color:var(--ok-dim);background:var(--ok-dim)}
.cell.part{border-color:var(--med-dim);background:var(--med-dim)}
.cell.gap{border-color:var(--crit-dim);background:var(--crit-dim)}
.cell.na{opacity:.62}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px}
.legend .lg{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.legend .lg i{width:10px;height:10px;border-radius:2px;display:block}
.tools{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(214px,1fr))}
.tool{border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel-2);padding:13px 14px}
.tool .n{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.tool .n .pill{margin-left:auto}
.tool .m{margin-top:7px;font:11.5px var(--mono);color:var(--muted)}

/* ── terminal ───────────────────────────────────────────── */
.term{background:#070910;font:12px/1.75 var(--mono);padding:14px 16px;color:#b9c2d4;max-height:430px;overflow:auto}
.term .line{white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--accent-2)}
.term .ok{color:var(--ok)} .term .warn{color:var(--warn)} .term .crit{color:var(--crit)} .term .dim{color:var(--faint)}
.term-input{display:flex;align-items:center;gap:9px;padding:9px 16px;border-top:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
.term-input input{flex:1;background:transparent;border:0;color:var(--ink);font:12.5px var(--mono);outline:none}

/* ── findings controls ──────────────────────────────────── */
.pill.off{opacity:.42;filter:saturate(.5)}
th button{background:transparent;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;display:inline-flex;align-items:center;gap:5px}
th button:hover{color:var(--muted)}
th button.active{color:var(--ink)}
th button.active::after{content:"▾";font-size:9px}
input[type=search]:focus-visible,input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── command palette ────────────────────────────────────── */
.palette{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:11vh;background:rgba(6,8,13,.6);backdrop-filter:blur(3px)}
.palette.open{display:flex}
.palette .box{width:min(620px,92vw);border:1px solid var(--line-3);border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.palette .inp{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--faint)}
.palette .inp input{flex:1;background:transparent;border:0;color:var(--ink);font:14px var(--sans);outline:none}
.palette .res{max-height:46vh;overflow:auto;padding:6px}
.palette .res button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink);font-size:13px;text-align:left}
.palette .res button .icon{color:var(--faint)}
.palette .res button:hover,.palette .res button.sel{background:var(--accent-dim)}
.palette .res button .k{margin-left:auto;font:10.5px var(--mono);color:var(--faint)}

/* ── responsive ─────────────────────────────────────────── */
@media(max-width:1080px){
  .grid.c2{grid-template-columns:1fr}
  .grid.c3{grid-template-columns:1fr}

/* ── tiny inline charts (no libs) ────────────────────────────────────────── */
function sparkline(values, w, h, color) {
  w = w || 96; h = h || 30;
  const max = Math.max(1, ...values), min = Math.min(...values);
  const span = Math.max(1, max - min);
  const pts = values.map((v, i) => {
    const x = values.length > 1 ? (i / (values.length - 1)) * w : w / 2;
    const y = h - 2 - ((v - min) / span) * (h - 6);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function areaChart(values, w, h) {
  w = w || 640; h = h || 150; const pad = 8;
  const max = Math.max(1, ...values);
  const X = (i) => pad + (i / (values.length - 1)) * (w - pad * 2);
  const Y = (v) => h - pad - (v / max) * (h - pad * 2);
  const line = values.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const area = line + ' L' + X(values.length - 1).toFixed(1) + ' ' + (h - pad) + ' L' + X(0).toFixed(1) + ' ' + (h - pad) + ' Z';
  const grid = [0, .5, 1].map((t) => '<line x1="' + pad + '" y1="' + (pad + t * (h - pad * 2)).toFixed(1) + '" x2="' + (w - pad) + '" y2="' + (pad + t * (h - pad * 2)).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>').join('');
  const last = values.length - 1;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#ag)"/><path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(last).toFixed(1) + '" cy="' + Y(values[last]).toFixed(1) + '" r="3.2" fill="var(--accent)"/></svg>';
}

function kpiCard(k) {
  const col = k.tone === 'crit' ? 'var(--crit)' : k.tone === 'high' ? 'var(--high)' : k.tone === 'med' ? 'var(--med)' : k.tone === 'ok' ? 'var(--ok)' : 'var(--accent)';
  const tag = k.view ? 'button' : 'div';
  return '<' + tag + ' class="kpi' + (k.tone ? ' tone-' + k.tone : '') + '"' + (k.view ? ' data-goto="' + k.view + '"' : '') + '>' +
    sparkline(DATA.trend.slice(-12), 78, 26, col) +
    '<div class="k">' + esc(k.k) + '</div>' +
    '<div class="v">' + esc(k.v) + '</div>' +
    '<div class="d">' + (k.dir ? '<span class="' + k.dir + '">' + (k.dir === 'up' ? '▲' : '▼') + '</span>' : '') + esc(k.d) + '</div>' +
  '</' + tag + '>';
}

/* Findings — filters, search and sort are live (state kept in `fstate`) */
const sevColor = (s) => ({ Critical:'var(--crit)', High:'var(--high)', Medium:'var(--med)', Low:'var(--low)', Info:'var(--info)' }[s] || 'var(--info)');
const SEV_ORDER = { Critical:0, High:1, Medium:2, Low:3, Info:4 };
const fstate = { q:'', sev:new Set(), sort:'sev' };
const SORTS = {
  sev: (a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || b.cvss - a.cvss,
  title: (a, b) => a.title.localeCompare(b.title),
  host: (a, b) => a.host.localeCompare(b.host) || SEV_ORDER[a.sev] - SEV_ORDER[b.sev],
  cvss: (a, b) => b.cvss - a.cvss,
  ts: (a, b) => b.ts.localeCompare(a.ts),
};
function findingsList() {
  const q = fstate.q.trim().toLowerCase();
  return DATA.findings.filter((f) =>
    (!fstate.sev.size || fstate.sev.has(f.sev)) &&
    (!q || (f.title + ' ' + f.host + ' ' + f.ep + ' ' + f.cwe).toLowerCase().includes(q))
  ).sort(SORTS[fstate.sort] || SORTS.sev);
}
function findingsRows() {
  const rows = findingsList();
  if (!rows.length) return '<tr><td colspan="8"><div class="empty">No findings match the current filters.</div></td></tr>';
  return rows.map((f) =>
    '<tr tabindex="0"><td>' + sevPill(f.sev) + '</td>' +
    '<td><b style="font-weight:550">' + esc(f.title) + '</b></td>' +
    '<td class="mono">' + esc(f.host) + '</td>' +
    '<td class="mono muted">' + esc(f.ep) + '</td>' +
    '<td class="mono faint">' + esc(f.cwe) + '</td>' +
    '<td class="r"><b style="color:' + sevColor(f.sev) + ';font-family:var(--mono)">' + f.cvss.toFixed(1) + '</b></td>' +
    '<td>' + statusPill(f.status) + '</td>' +

}
function viewFindings() {
  const sev = DATA.severity;

    '<th' + (align ? ' class="' + align + '"' : '') + '><button data-sort="' + key + '"' + (fstate.sort === key ? ' class="active"' : '') + '>' + label + '</button></th>';

      chips +
    '</div></div>' +
    '<div class="panel"><div class="panel-head"><h2>All findings</h2><span class="hint" id="fcount">' + findingsList().length + ' of ' + DATA.findings.length + ' findings</span></div>' +
      '<div class="panel-body tight"><table><thead><tr>' +

/* ── Coverage ────────────────────────────────────────────────────────────── */

    '<div style="margin-top:9px"><span class="pill ' + tone[c.st] + ' nodot">' + c.st + '</span></div></div>').join('');

  return pageHead('Coverage', 'Which attack classes have been exercised, per the methodology.',
      '<button class="btn">' + icon('i-sliders') + 'Methodology</button><button class="btn btn-primary">' + icon('i-target') + 'Plan the gaps</button>') +
    '<div class="kpis">' + [
      { k:'Coverage', v:'68%', tone:'ok', d:'9 classes tracked' },
      { k:'Exercised', v:3, tone:'ok', d:'web · network · evidencing' },
      { k:'Partial', v:3, tone:'med', d:'auth · API · client-side' },

    panel('Attack classes', 'colour = coverage state', '<div class="panel-body"><div class="matrix">' + cells + '</div></div>');
}

  const inside = DATA.scopeIn.map((s) => lrow({

    sub: esc(s.t) + ' · ' + esc(s.note), right:'<span class="pill ok nodot">allowed</span>',
  })).join('');
  const outside = DATA.scopeOut.map((s) => lrow({
    icon:'i-shield', ico:'crit', title:'<span class="mono">' + esc(s.r) + '</span>',
    sub: esc(s.note), right:'<span class="pill crit nodot">denied</span>',
  })).join('');
  return pageHead('Scope', 'The single source of truth the guard checks before any command runs.',
      '<button class="btn">' + icon('i-doc') + 'Scope file</button><button class="btn btn-primary">' + icon('i-check') + 'Re-anchor scope</button>') +
    '<div class="panel" style="margin-bottom:16px"><div class="panel-body" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
      icon('i-target') +
      '<input id="scope-check" type="text" placeholder="Check a host or CIDR against scope…" style="flex:1;min-width:240px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel-2);color:var(--ink);font:13px var(--mono)">' +
      '<span id="scope-verdict"><span class="pill info nodot">waiting for input</span></span>' +
    '</div></div>' +
    '<div class="grid c2">' +
      panel('In scope', DATA.scopeIn.length + ' rules', '<div class="list">' + inside + '</div>') +
      panel('Out of scope', DATA.scopeOut.length + ' rules', '<div class="list">' + outside + '</div>') +
    '</div>';
}

/* ── Configuration ───────────────────────────────────────────────────────── */
function viewConfig() {
  const groups = DATA.config.map((g) => panel(g.g, g.rows.filter((r) => r.on).length + '/' + g.rows.length + ' enabled',
    '<div class="list">' + g.rows.map((r) => lrow({ title: esc(r.k), right: toggle(r.on, r.k) })).join('') + '</div>')).join('');
  return pageHead('Configuration', 'Guardrails, data handling and notification policy. Every change is audit-logged.',
      '<button class="btn btn-ghost">Restore defaults</button><button class="btn btn-primary">' + icon('i-check') + 'Apply</button>') +
    '<div class="grid c2">' + groups + '</div>';
}

/* ── Team ────────────────────────────────────────────────────────────────── */
function viewTeam() {
  const role = (r) => r === 'lead operator' ? 'accent' : (r === 'agent' || r === 'policy agent') ? 'ok' : 'info';
  const rows = DATA.team.map((m) => lrow({
    icon: 'i-net',
    title: '<b>' + esc(m.n) + '</b> <span class="pill ' + role(m.role) + ' nodot">' + esc(m.role) + '</span>',
    sub: 'last active ' + esc(m.last),
    right: '<span class="pill ' + (m.state === 'active' ? 'ok' : 'info') + ' nodot">' + esc(m.state) + '</span>',
  })).join('');
  return pageHead('Team', 'Who can act on this engagement, and with what authority.',
      '<button class="btn">' + icon('i-list') + 'Access log</button><button class="btn btn-primary">' + icon('i-net') + 'Invite</button>') +
    '<div class="kpis">' + [
      { k:'Members', v:4, tone:'accent', d:'2 agents · 2 humans' },
      { k:'Active now', v:3, tone:'ok', d:'1 read-only' },
      { k:'Actions today', v:126, tone:null, d:'attributed in the ledger' },
      { k:'Pending invites', v:0, tone:null, d:'none' },
    ].map(kpiCard).join('') + '</div>' +
    panel('Members', null, '<div class="list">' + rows + '</div>');
}

/* ── Arsenal ─────────────────────────────────────────────────────────────── */
function viewArsenal() {
  const cards = DATA.arsenal.map((t) =>
    '<div class="tool"><div class="n">' + icon(t.cat === 'c2' ? 'i-bolt' : 'i-term') + esc(t.n) +
    '<span class="pill ' + (t.st === 'installed' ? 'ok' : 'crit') + ' nodot">' + t.st + '</span></div>' +
    '<div class="m">' + esc(t.cat) + ' · v' + esc(t.v) + '</div></div>').join('');
  const missing = DATA.arsenal.filter((t) => t.st !== 'installed').length;
  return pageHead('Arsenal', 'Tools available to the fleet, resolved per campaign template.',
      '<button class="btn">' + icon('i-list') + 'Check versions</button><button class="btn btn-primary">' + icon('i-bolt') + 'Install missing</button>') +
    '<div class="kpis">' + [
      { k:'Installed', v:(DATA.arsenal.length - missing) + '/' + DATA.arsenal.length, tone:'ok', d:'ready to dispatch' },
      { k:'Missing', v:missing, tone:'crit', d:'AD · wireless' },
      { k:'Categories', v:6, tone:null, d:'recon → c2' },
      { k:'Avg. tool age', v:'3w', tone:null, d:'since last update' },
    ].map(kpiCard).join('') + '</div>' +
    panel('Toolbox', DATA.arsenal.length + ' tools', '<div class="panel-body"><div class="tools">' + cards + '</div></div>');

/* ── Reports ─────────────────────────────────────────────────────────────── */
function viewReports() {
  const st = { draft:['warn','draft'], final:['ok','final'] };
  const rows = DATA.reports.map((r) => lrow({
    icon: 'i-doc', ico: r.st === 'final' ? 'ok' : 'accent',
    title: esc(r.n) + ' <span class="pill ' + st[r.st][0] + ' nodot">' + st[r.st][1] + '</span>',
    sub: '<span class="mono">' + esc(r.fmt) + '</span> · ' + esc(r.size) + ' · ' + esc(r.when),
    right: '<button class="btn btn-sm">Open</button>',
  })).join('');
  return pageHead('Reports', 'Client-facing deliverables and evidence bundles.',
      '<button class="btn">' + icon('i-doc') + 'Template</button><button class="btn btn-primary">' + icon('i-bolt') + 'Generate draft</button>') +
    '<div class="kpis">' + [
      { k:'Drafts', v:2, tone:'med', d:'awaiting review' },
      { k:'Final', v:2, tone:'ok', d:'hash-chained' },
      { k:'Critical findings', v:2, tone:'crit', d:'both proven' },
      { k:'Evidence size', v:'9.5 MB', tone:null, d:'4 artifacts' },
    ].map(kpiCard).join('') + '</div>' +
    panel('Deliverables', DATA.reports.length + ' files', '<div class="list">' + rows + '</div>');
}

/* ── Terminal ────────────────────────────────────────────────────────────── */
function viewTerminal() {
  const lines = DATA.term.map((l) => '<div class="line ' + l.cls + '">' + esc(l.t) + '</div>').join('');
  return pageHead('Terminal', 'A live PTY, with every command still checked against scope.',
      '<button class="btn">' + icon('i-server') + 'sess-3</button><button class="btn btn-danger">' + icon('i-term') + 'Stop session</button>') +
    '<div class="panel"><div class="panel-head"><h2>sess-3 · sqlmap</h2><span class="hint">app.acme.example · live since 11:43</span><span class="ways"><span class="pill ok nodot">scope ok</span></span></div>' +
      '<div class="term" id="tlog">' + lines + '</div>' +
      '<div class="term-input">' + icon('i-term') + '<input id="tinput" type="text" placeholder="Type a command — responses are simulated in this draft" autocomplete="off"></div>' +
    '</div>';
}

/* ── shared row / value helpers ─────────────────────────────────────────── */
function lrow(o) {
  return '<div class="lrow">' +
    (o.icon ? '<span class="feed-ico ' + (o.ico || '') + '">' + icon(o.icon) + '</span>' : '') +
    '<div class="grow"><div class="t">' + o.title + '</div>' + (o.sub ? '<div class="s">' + o.sub + '</div>' : '') + '</div>' +
    (o.right ? '<div class="right">' + o.right + '</div>' : '') +
  '</div>';
}
function kv(pairs) {
  return '<div class="kv">' + pairs.map((p) =>
    '<div><div class="k">' + esc(p[0]) + '</div><div class="v">' + p[1] + '</div></div>').join('') + '</div>';
}
function toggle(on, label) {
  return '<button class="sw' + (on ? ' on' : '') + '" data-sw aria-pressed="' + (on ? 'true' : 'false') + '" aria-label="' + esc(label) + '"></button>';
}

/* ── findings: filtering, search and sorting ────────────────────────────── */
function refreshFindings() {
  const body = document.getElementById('fbody');
  if (!body) return;
  body.innerHTML = findingsRows();
  const count = document.getElementById('fcount');
  if (count) count.textContent = findingsList().length + ' of ' + DATA.findings.length + ' findings';
  document.querySelectorAll('[data-sev]').forEach((b) =>
    b.classList.toggle('off', fstate.sev.size > 0 && !fstate.sev.has(b.dataset.sev)));
  document.querySelectorAll('[data-sort]').forEach((b) =>
    b.classList.toggle('active', b.dataset.sort === fstate.sort));
}

/* ── Terminal + scope check (view-local behaviour) ──────────────────────── */
function bindTerminal() {
  const input = document.getElementById('tinput');
  if (!input) return;
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || !input.value.trim()) return;
    const cmd = input.value.trim();
    const log = document.getElementById('tlog');
    const line = (cls, t) => '<div class="line ' + cls + '">' + esc(t) + '</div>';
    const rule = DATA.scopeIn.find((s) => cmd.includes(s.r));
    const denied = DATA.scopeOut.find((s) => cmd.includes(s.r.replace('*.', '')));
    let out = line('p', '$ ' + cmd) + line('dim', '[draft] no backend attached — this response is simulated');
    if (denied) out += line('crit', '[scope] ' + denied.r + ' is out of scope — command blocked by the guard');
    else if (rule) out += line('', '[scope] ' + rule.r + ' ∈ scope (' + rule.t + ') — gate ok') + line('', 'queued in the pipeline · run ' + (1043 + DATA.ledger.length));
    else out += line('warn', '[scope] no in-scope asset matched — needs explicit approval');
    log.insertAdjacentHTML('beforeend', out);
    log.scrollTop = log.scrollHeight;
    input.value = '';
  });
}
function bindScopeCheck() {
  const el = document.getElementById('scope-check');
  if (!el) return;
  el.addEventListener('input', () => {
    const q = el.value.trim().toLowerCase();
    const out = document.getElementById('scope-verdict');
    if (!q) { out.innerHTML = '<span class="pill info nodot">waiting for input</span>'; return; }
    const hit = DATA.scopeIn.find((s) => s.r.toLowerCase().includes(q));
    const bad = DATA.scopeOut.find((s) => s.r.toLowerCase().replace('*.', '').includes(q));
    out.innerHTML = hit ? '<span class="pill ok nodot">in scope · ' + esc(hit.r) + '</span>' :
      bad ? '<span class="pill crit nodot">out of scope · ' + esc(bad.r) + '</span>' :
      '<span class="pill warn nodot">unknown · requires approval</span>';
  });
}

/* ── Command palette ────────────────────────────────────────────────────── */
function paletteRender(query) {
  const q = (query || '').toLowerCase();
  const items = NAV.flatMap((g) => g.items.map((i) => ({ id:i.id, label:i.label, group:g.g, icon:i.icon })));
  const hits = items.filter((i) => !q || (i.label + ' ' + i.group).toLowerCase().includes(q));
  document.getElementById('pres').innerHTML = hits.length
    ? hits.map((h, idx) => '<button data-view="' + h.id + '"' + (idx === 0 ? ' class="sel"' : '') + '>' + icon(h.icon) + '<span>' + esc(h.label) + '</span><span class="k">' + esc(h.group) + '</span></button>').join('')
    : '<div class="empty">No matches</div>';
}
function openPalette() {
  document.getElementById('palette').classList.add('open');
  const q = document.getElementById('pmq');
  q.value = '';
  paletteRender('');
  setTimeout(() => q.focus(), 0);
}
function closePalette() { document.getElementById('palette').classList.remove('open'); }

/* ── router ─────────────────────────────────────────────────────────────── */
const LABELS = {}, GROUPS = {};
NAV.forEach((g) => g.items.forEach((i) => { LABELS[i.id] = i.label; GROUPS[i.id] = g.g; }));
const VIEWS = {
  overview: viewOverview, campaign: viewCampaign, mission: viewMission, approvals: viewApprovals, ledger: viewLedger,
  findings: viewFindings, pipeline: viewPipeline, sessions: viewSessions, graph: viewGraph, coverage: viewCoverage,
  scope: viewScope, config: viewConfig, team: viewTeam, arsenal: viewArsenal, reports: viewReports, terminal: viewTerminal,
};
function render(view) {
  if (!VIEWS[view]) view = 'overview';
  renderNav(view);
  document.getElementById('crumbs').innerHTML = esc(GROUPS[view]) + ' <span class="faint">/</span> <b>' + esc(LABELS[view]) + '</b>';
  document.getElementById('view').innerHTML = VIEWS[view]();
  window.scrollTo({ top: 0, behavior: 'auto' });
  if (view === 'terminal') bindTerminal();
  if (view === 'scope') bindScopeCheck();
}

/* ── events ─────────────────────────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const sw = e.target.closest('[data-sw]');
  if (sw) {
    sw.classList.toggle('on');
    sw.setAttribute('aria-pressed', sw.classList.contains('on') ? 'true' : 'false');
    return;
  }
  const sev = e.target.closest('[data-sev]');
  if (sev) { const v = sev.dataset.sev; if (fstate.sev.has(v)) fstate.sev.delete(v); else fstate.sev.add(v); refreshFindings(); return; }
  const sort = e.target.closest('[data-sort]');
  if (sort) { fstate.sort = sort.dataset.sort; refreshFindings(); return; }
  const go = e.target.closest('[data-view],[data-goto]');
  if (go) { render(go.dataset.view || go.dataset.goto); closePalette(); return; }
  if (e.target.closest('[data-palette]')) openPalette();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'fsearch') { fstate.q = e.target.value; refreshFindings(); }
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') closePalette();
});
document.getElementById('palette').addEventListener('click', (e) => { if (e.target.id === 'palette') closePalette(); });
document.getElementById('pmq').addEventListener('input', (e) => paletteRender(e.target.value));
document.getElementById('pmq').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { const first = document.querySelector('#pres button'); if (first) { render(first.dataset.view); closePalette(); } }
});

function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 30000);
render('overview');
</script>
