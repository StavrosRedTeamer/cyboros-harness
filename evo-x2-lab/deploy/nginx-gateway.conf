# evo-x2-lab — gateway OpenAI-compatible
# Smista le richieste sul server giusto in base al campo "model" nel body JSON.
# Unico punto di ingresso per gli agenti (porta 8080).
#
# Richiede nginx con modulo njs (le immagini ufficiali nginx:latest lo includono).
#   load_module modules/ngx_http_js_module.so;
#   js_import come sotto; router.js va copiato in /etc/nginx/njs/.
#
# Mapping model → backend: coerente con deploy/models.yaml.

load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    js_path "/etc/nginx/njs/";
    js_import router from router.js;

    # Alias logico → backend (IP:porta letterali: nessun resolver necessario).
    js_var $target_upstream;
    map $target_upstream $backend_url {
        default          http://10.0.0.1:8081;   # brain
        "brain"          http://10.0.0.1:8081;   # Qwen3.8-Flash-Next-Heretic
        "coder"          http://10.0.0.2:8101;   # Qwen3-Coder-Next
        "toolcaller"     http://10.0.0.2:8102;   # gpt-oss-20B
        "parser"         http://10.0.0.2:8103;   # Qwen3.5-9B
        "cyber"          http://10.0.0.2:8104;   # Deep Hat V2 (slot bake-off)
        "triage"         http://10.0.0.2:8105;   # CyberSecQwen-4B
        "embed"          http://10.0.0.2:8106;   # BGE-M3
        "rerank"         http://10.0.0.2:8107;   # Qwen3-Reranker
    }

    # Log di audit: ogni richiesta = timestamp, modello, client, esito.
    # (log_format è una direttiva http-level, non server-level)
    log_format audit '$time_iso8601 remote=$remote_addr model=$target_upstream '
                     'status=$status bytes=$body_bytes_sent dur=$request_time';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/evo-x2-audit.log audit;

        client_max_body_size 50m;
        proxy_read_timeout 600s;      # i piani del brain sono lunghi
        proxy_buffering off;          # streaming SSE dei token

        # Catalogo modelli per i client OpenAI-compatible
        location = /v1/models {
            js_content router.catalog;
        }

        # Chat/completions e affini: routing per campo "model" nel body
        location ~ ^/v1/(chat/completions|responses|completions)$ {
            js_content router.route;
        }

        # Embeddings: slot dedicato
        location = /v1/embeddings {
            proxy_pass http://10.0.0.2:8106;
            proxy_set_header Host $host;
        }

        location = /healthz {
            return 200 "ok\n";
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"message":"unknown endpoint"}}';
        }

        # Destinazione del routing dinamico (router.route → internalRedirect)
        location @proxy {
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
