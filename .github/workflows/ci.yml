name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The suite has no network and no third-party dependencies: zero npm install
# step, by design. Node is the only requirement (engines: >=22, because the
# Command Center backend uses node:sqlite).

# Analisi statica: CodeQL NON è utilizzabile qui. Su un repository privato il code scanning di
# GitHub richiede GitHub Code Security (a pagamento): la run fallisce con 403 "GitHub Code
# Security or GitHub Advanced Security must be enabled for this repository to use code
# scanning". Il sostituto è `tools/test-lint.js`, che gira con la suite nel job `test` e copre la
# sola classe che ha già prodotto un rosso reale — un `require` verso un file non tracciato
# (l'incidente di `tools/chain-log.js`: 11 file del motore lo richiedevano, il file non era mai
# stato committato, e `master` era rosso a clone pulito mentre in locale era verde).
# Se un giorno il piano abilita Code Security, il job CodeQL si aggiunge con
# `permissions: security-events: write` a livello di JOB: qui sotto non si allarga nulla, perché
# nessun job di questo workflow scrive e nessuno deve poterlo fare.
permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check toolchain
        run: |
          node --version
          npm --version

      - name: Confirm zero dependencies
        # The zero-dependency claim is load-bearing: it is why the harness runs
        # air-gapped. Fail if a dependency ever sneaks in unnoticed.
        run: |
          if [ -s package-lock.json ]; then
            echo "::error::package-lock.json exists - this project is meant to have zero dependencies"
            exit 1
          fi
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          devdeps=$(node -p "Object.keys(require('./package.json').devDependencies||{}).length")
          echo "runtime deps: $deps, dev deps: $devdeps"
          if [ "$deps" != "0" ] || [ "$devdeps" != "0" ]; then
            echo "::error::expected zero dependencies, found $deps runtime / $devdeps dev"
            exit 1
          fi

      - name: Self-check (cardini del workspace)
        # doctor esce 2 quando i cardini del repo sono rotti (file di progetto mancanti,
        # registry schema invalido): quello è un errore, non un avviso. Un exit 1 significa
        # "mancano binari/runtime", che su un runner nudo è atteso e non blocca.
        run: |
          set +e
          node tools/doctor.js --check
          code=$?
          if [ "$code" -ge 2 ]; then
            echo "::error::doctor: cardini del workspace rotti (exit $code)"
            exit 1
          fi
          echo "doctor: cardini OK (exit $code; i binari mancanti sul runner non contano)"

      - name: Vet agenti vs binario Freebuff
        # Il vet confronta gli agenti locali con i tool/modelli del binario Freebuff
        # installato: senza binario è un pre-flight locale e qui si salta, con un messaggio
        # esplicito invece di un silenzioso OK.
        run: |
          if [ -x "$HOME/.config/manicode/freebuff" ]; then
            node tools/vet-agents-vs-freebuff.js
          else
            echo "binario Freebuff assente sul runner: vet saltato (pre-flight locale)"
          fi

      - name: Test suite (offline)
        # tools/test-*.js, classified offline/loopback/e2e by the runner.
        # Default `npm test` excludes e2e: those need live targets and a browser.
        # `npm test` stays sequential on purpose (deterministic local runs);
        # CI uses 2 workers because hosted runners have 2 cores.
        run: npm run test:ci

      - name: List the excluded e2e tests
        if: always()
        run: npm run test:list

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fail if engagement data is ever tracked
        # The .gitignore is the only thing keeping client data out of history.
        # A regression here is a confidentiality incident, so make it loud.
        run: |
          set -e
          bad=0
          for pat in '^temp/' '^scope\.json$' '^auth\.json$' '^c2\.json$' '(^|/)(auth|scope|c2|wifi-scope|mobile-scope|mcp)[^/]*\.bak(\.json)?(-[0-9A-Za-z-]+)?$' '^reports/' '^artifacts/'; do
            hits=$(git ls-files | grep -E "$pat" || true)
            if [ -n "$hits" ]; then
              echo "::error::tracked files matching '$pat' must not be committed:"
              echo "$hits"
              bad=1
            fi
          done
          exit $bad

      - name: .gitignore must still cover engagement data
        # Le regole di .gitignore sono l'unica cosa che tiene i dati cliente fuori da
        # history: qui si verifica che coprano davvero i path di engagement, invece di
        # elencarli a mano nel workflow e sperare che restino allineati.
        run: |
          bad=0
          for f in scope.json auth.json c2.json wifi-scope.json mobile-scope.json mcp.json \
                   scope.acme.bak.json scope.json.bak-20261006 temp/x reports/x artifacts/x campaign.json \
                   reports/approvals.jsonl scripts/probe_x.py scripts/record-x-findings.js \
                   tools/.pace.json local-only/one-off.py .scope.json.kate-swp; do
            if ! git check-ignore -q "$f"; then
              echo "::error::$f non è ignorato dal .gitignore"
              bad=1
            fi
          done
          exit $bad

  history:
    name: repo history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `hygiene` controlla l'indice, questo job controlla la STORIA: è la storia che
          # viene pubblicata insieme al repository. Il gate interroga path e lineage di ogni
          # ref, quindi il default (fetch-depth: 1) lo farebbe uscire in SKIP e non vedrebbe
          # nulla: le evidenze di engagement e il corpus `refs/` sono rimasti in storia
          # esattamente perché nessun gate la guardava.
          fetch-depth: 0
          fetch-tags: true

      - name: Nessun materiale di engagement o corpus nella storia
        run: node tools/test-repo-history.js
